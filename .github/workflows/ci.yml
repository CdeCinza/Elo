name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: elo_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: elo_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, dom, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate --no-interaction
      - name: Run PHPUnit
        run: vendor/bin/phpunit --log-junit=storage/phpunit-results.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: phpunit-results
          path: storage/phpunit-results.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit root JavaScript dependencies
        run: npm audit --audit-level=high
        working-directory: .
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  frontend-browser:
    name: Frontend browser checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start frontend
        run: |
          node node_modules/next/dist/bin/next start > "$RUNNER_TEMP/elo-next.log" 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000
      - name: Run browser and accessibility checks
        run: npx playwright test e2e/tests/project-tour.spec.ts e2e/tests/accessibility.spec.ts e2e/tests/usability.spec.ts e2e/tests/toast.spec.ts
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: next-server-log
          path: ${{ runner.temp }}/elo-next.log
          if-no-files-found: ignore
          retention-days: 7
